

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Анимация появления */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Контейнер приложения -->
    <div class="max-w-md mx-auto p-4 fade-in">
        
        <!-- Заголовок -->
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-blue-400">Premium Shop</h1>
            <p class="text-gray-400 text-sm">Лучшие товары для вашего бота</p>
        </header>

        <!-- Карточка товара -->
        <div class="bg-gray-800 rounded-2xl p-4 shadow-lg border border-gray-700 mb-6">
            <div class="h-32 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl mb-4 flex items-center justify-center text-4xl">
                💎
            </div>
            <h2 class="text-xl font-semibold mb-1">Супер Подписка</h2>
            <p class="text-gray-400 text-sm mb-4">Доступ ко всем скрытым функциям канала и бота.</p>
            <div class="flex justify-between items-center">
                <span class="text-2xl font-bold">500 ₽</span>
                <!-- Кнопка Купить -->
                <button onclick="buyProduct()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-xl transition-all active:scale-95">
                    Купить
                </button>
            </div>
        </div>

        <!-- Дополнительная информация -->
        <div class="bg-gray-800/50 rounded-xl p-4 text-sm text-gray-400">
            <p>Нажимая кнопку "Купить", вы отправите запрос боту на создание счета для оплаты.</p>
        </div>

        <!-- Статус -->
        <div id="status" class="mt-4 text-center text-sm text-yellow-400 hidden">
            Обработка...
        </div>

    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;

        // Сообщаем Телеграму, что приложение готово
        tg.ready();
        
        // Расширяем на весь экран
        tg.expand();

        // Устанавливаем цвета темы Телеграм
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#111827';
        document.body.style.color = tg.themeParams.text_color || '#ffffff';

        // Функция покупки
        function buyProduct() {
            // Показываем статус
            const statusEl = document.getElementById('status');
            statusEl.classList.remove('hidden');
            
            // Данные для отправки боту
            const data = {
                action: 'invoice',
                item_id: 123,
                price: 500
            };

            // Отправляем данные боту (это закроет WebApp и передаст JSON в process_web_app_data)
            tg.sendData(JSON.stringify(data));
        }

        // Настройка главной кнопки (MainButton) в самом низу интерфейса Telegram
        tg.MainButton.setText("Закрыть магазин");
        tg.MainButton.onClick(() => {
            tg.close();
        });
        tg.MainButton.show();
    </script>
</body>
</html>
